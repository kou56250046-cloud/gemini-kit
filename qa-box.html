<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'">
<title>質問箱</title>
<style>
/* 色は gemini-kit の dash.css（デジタル庁の配色）にそろえる */
:root {
  --text: #1A1A1C; --label: #626264; --link: #0017C1; --bg: #F8F8FB; --card: #FFFFFF; --control: #F1F1F4; --line: #CCCCCC;
  --ok: #0017C1; --ok-bg: #E8F1FE;
  --tbd: #4D4D4D; --tbd-bg: #EEEEEE;
  --prop: #5B2A99; --prop-bg: #F3ECFB;
  --doing: #6E5500; --doing-bg: #FBF5E0;
  --check: #CE0000; --check-bg: #FDEEEE;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 18px; margin: 0; }
#save-state { font-size: 12px; color: var(--label); }
#save-state.bad { color: var(--check); font-weight: bold; }
.io { margin-left: auto; display: flex; gap: 6px; }
#confirm:empty { display: none; }
#confirm { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--check-bg); padding: 6px 10px; border-radius: 6px; }
nav#tabs { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
.tab { border: 1px solid var(--line); border-bottom: none; background: var(--control); padding: 8px 14px; border-radius: 8px 8px 0 0; font: inherit; cursor: pointer; white-space: nowrap; }
.tab.on { background: var(--card); font-weight: bold; color: var(--link); }
main { padding: 0 16px 40px; max-width: 1280px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
.card.empty { text-align: center; }
h2 { font-size: 17px; margin: 0 0 8px; }
h3 { font-size: 15px; margin: 12px 0 6px; }
.muted { color: var(--label); font-size: 13px; }
.nowrap { white-space: nowrap; }
button, select, input, textarea { font: inherit; }
button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { background: var(--control); }
button.primary { background: var(--link); border-color: var(--link); color: #fff; }
button.primary:disabled { opacity: .5; cursor: default; }
button.danger { color: var(--check); border-color: var(--check); }
button.small { padding: 2px 8px; font-size: 13px; }
button.link { border: none; background: none; padding: 0; color: var(--link); text-decoration: underline; text-align: left; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #3460FB; outline-offset: 1px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: Consolas, "Meiryo", monospace; font-size: 13px; }
input[type=text], input[type=search], input[type=date], select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: #fff; max-width: 100%; }
.field { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; font-size: 13px; color: var(--label); }
.field input, .field textarea { color: var(--text); width: 100%; }
.inline { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.toolbar input[type=search] { min-width: 220px; flex: 1 1 220px; }

/* 状態：色と文字の両方で示す */
.st { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid currentColor; }
.st-ok { color: var(--ok); background: var(--ok-bg); }
.st-tbd { color: var(--tbd); background: var(--tbd-bg); }
.st-prop { color: var(--prop); background: var(--prop-bg); }
.st-doing { color: var(--doing); background: var(--doing-bg); }
.st-check { color: var(--check); background: var(--check-bg); }
.st-select { font-weight: bold; border: 1px solid currentColor; }
.edited { display: inline-block; margin-left: 4px; font-size: 11px; color: var(--label); border: 1px dashed var(--label); border-radius: 4px; padding: 0 3px; }
.counts { display: flex; flex-direction: column; gap: 6px; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--control); }
.bar .seg { border: none; border-radius: 0; }
.bar .seg.st-ok { background: var(--ok); } .bar .seg.st-tbd { background: #8A8A8A; } .bar .seg.st-prop { background: #8E5BD1; } .bar .seg.st-doing { background: #C9A000; } .bar .seg.st-check { background: var(--check); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 14px; padding: 2px 10px; font-size: 13px; font-weight: bold; }
.chip.on { outline: 2px solid var(--text); }

/* 表 */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; }
th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
th { background: #EEF2F7; white-space: nowrap; }
table.grid td.id { white-space: nowrap; font-weight: bold; }
table.grid td.q { min-width: 260px; }
table.grid td input[type=text] { width: 9em; }
table.grid td.num { white-space: nowrap; }
table.grid td.muted { min-width: 14em; }
table.grid tr.open > td { background: var(--ok-bg); }
table.grid tr.detail-row > td { background: #FBFBFD; padding: 0; }
td.overdue input { border-color: var(--check); }
.overdue-label { display: block; color: var(--check); font-size: 12px; font-weight: bold; }
.detail { padding: 10px 14px; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 12px; }
.answer-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.qtable { margin: 8px 0; }
.md p { margin: 6px 0; }
.md h2, .md h3, .md h4, .md h5 { font-size: 14px; margin: 10px 0 4px; }
.md pre { background: #F3F5F8; border: 1px solid var(--line); padding: 8px 10px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; }
.md code { background: #F0F2F5; padding: 0 4px; border-radius: 3px; font-family: Consolas, monospace; font-size: 12.5px; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--label); }
td.st-cell { white-space: nowrap; }
.hist summary { cursor: pointer; color: var(--label); font-size: 13px; }
.hist ul { font-size: 12.5px; margin: 4px 0; padding-left: 18px; max-height: 240px; overflow-y: auto; }

/* 取り込みのプレビュー */
.pvlist { list-style: none; padding: 0; margin: 0; }
.pv { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
.pv.warn { border-color: #C9A000; background: #FFFCF0; }
.pv-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-size: 12px; font-weight: bold; padding: 0 6px; border-radius: 4px; color: #fff; }
.tag.new { background: var(--link); } .tag.upd { background: #4D4D4D; }
.warns { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--doing); }
.warn-text { color: var(--check); font-weight: bold; }
.bad-blocks { color: var(--check); }
.steps li { margin: 4px 0; }
pre.prompt { white-space: pre-wrap; background: #F3F5F8; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 13px; }

@media (max-width: 640px) {
  header { padding: 8px 10px; }
  main, nav#tabs { padding-left: 8px; padding-right: 8px; }
  .io { margin-left: 0; }
  table.grid td.q { min-width: 200px; }
}
</style>
</head>
<body>
<header>
  <h1>質問箱</h1>
  <span id="save-state">読み込み中…</span>
  <div class="io">
    <button type="button" id="btn-export" title="すべての質問を JSON で保存">書き出し</button>
    <button type="button" id="btn-import" title="書き出した JSON で置き換える">読み込み</button>
    <input type="file" id="file-json" accept=".json,application/json" hidden>
  </div>
  <div id="confirm" role="alert"></div>
</header>
<nav id="tabs" role="tablist" aria-label="画面"></nav>
<main id="main"></main>
<script>
globalThis.GK = globalThis.GK || {};
GK.PROMPT = "あなたは質問箱の回答係です。質問には、ソースに書かれていることを元に答えてください。ソースに無いことを事実のように書いてはいけません。\n回答は必ず次の形式だけで返してください。前置き・後書き・補足の文は付けず、全体を ```markdown のコードブロック 1 つに入れてください。\n\n## 形式（質問 1 つにつき 1 ブロック。複数の質問なら、ブロックを続けて並べる）\n\n```markdown\n## 新規\n案件: （案件名。分からなければ空欄）\n分類: （例：業務 / データ設計 / マスタ / 画面 / 運用 / その他）\n状態: （確定 / 未確定 / 提案 / 対応中 / 要確認 のどれか 1 つ）\n根拠: （根拠にしたソースの名前。複数なら「、」でつなぐ）\n要確認の理由: （状態が要確認・未確定・提案のときだけ。提案なら、そう考えた理由。ほかは空欄）\n### 質問\n（受け取った質問をそのまま）\n### 回答\n（回答の本文。Markdown で書く）\n```\n\n## 規則\n\n1. 見出しの行\n   - 新しい質問は「## 新規」にする\n   - 質問の中で「Q-012」のように番号を指定されたら、その番号のまま「## Q-012」にする\n2. 状態は、次の 5 つのどれか 1 つだけにする\n   - 確定：ソースに明記されていて、決まっている\n   - 未確定：ソースに案や候補はあるが、決まっていない\n   - 提案：ソースには決まりも案も無く、あなた（NotebookLM）が考えた案。一般的な設計の考え方やソースの別の箇所から推し量ったもの\n   - 対応中：ソースで、誰かが調べている・作っていると書かれている\n   - 要確認：ソースに書かれていない、またはソースどうしが食い違う\n3. ソースに無いことを、ソースに書いてあるかのように書かない\n   - 案を出せるときは「提案」にし、本文でも「提案：」と分かるように書いて、要確認の理由に考えた理由を書く\n   - 案も出せないときは「要確認」にして、理由を書く\n   - 1 つの回答に確定した部分と提案の部分が混ざるときは、ブロックの状態はいちばん確かでないもの（要確認 → 提案 → 対応中 → 未確定 → 確定 の順）にする\n4. 回答の中の見出しは「####」以下を使う。「##」と「###」は使わない\n5. マスタ案・データ設計・項目の一覧・比較など、表にできるものは Markdown の表にする\n   - 表の 1 列目は項目名にする（同じ表の中で重複させない）\n   - 表のいちばん右に「状態」列を必ず付け、行ごとに 確定 / 未確定 / 提案 / 対応中 / 要確認 のどれかを入れる\n   - 行の状態の決め方は、規則 2・3 と同じ。ソースに無い項目を足すときは、その行を「提案」にする\n6. 表のセルの中では改行しない（改行が要るときは \u003cbr\u003e を使う）\n";
// ---- md.js ----
// Markdown → 構造 → DOM。Gemini が出す範囲（見出し・段落・表・入れ子の箇条書き・チェック・引用・コード・区切り線）に対応する。
// DOM は createElement / textContent で組む（貼られた文字列を HTML として解釈しない）。
// 描画の途中で差し込める口（text / inlineCode / code / heading / table）を用意し、文書ビューが ID や図を足す。
(function (GK) {
  "use strict";

  // ---------- パース ----------
  const RE = {
    fence: /^\s*(```|~~~)\s*([\w-]*)\s*$/,
    heading: /^(#{1,6})\s+(.*?)\s*#*\s*$/,
    tableRow: /^\s*\|.*\|\s*$/,
    tableSep: /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,
    list: /^(\s*)([-*+]|\d+[.)])\s+(.*)$/,
    quote: /^\s*>\s?(.*)$/,
    hr: /^\s*([-*_])(\s*\1){2,}\s*$/,
  };

  function splitRow(line) {
    let s = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    const cells = [];
    let cur = "";
    for (let i = 0; i < s.length; i++) {
      if (s[i] === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; }
      if (s[i] === "|") { cells.push(cur.trim()); cur = ""; continue; }
      cur += s[i];
    }
    cells.push(cur.trim());
    return cells;
  }

  // 戻り値：[{type, line, ...}]。line は 1 始まりの開始行
  function parse(src) {
    const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    const blocks = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const start = i + 1;
      let m;
      if ((m = line.match(RE.fence))) {
        const mark = m[1];
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith(mark)) buf.push(lines[i++]);
        i++;
        blocks.push({ type: "code", lang: m[2].toLowerCase(), text: buf.join("\n"), line: start, end: i });
        continue;
      }
      if ((m = line.match(RE.heading))) {
        blocks.push({ type: "heading", level: m[1].length, text: m[2], line: start, end: start });
        i++;
        continue;
      }
      if (RE.tableRow.test(line) && i + 1 < lines.length && RE.tableSep.test(lines[i + 1])) {
        const head = splitRow(line);
        const align = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : ""));
        i += 2;
        const rows = [];
        while (i < lines.length && RE.tableRow.test(lines[i])) rows.push(splitRow(lines[i++]));
        blocks.push({ type: "table", head, align, rows, line: start, end: i });
        continue;
      }
      if (RE.list.test(line)) {
        const items = [];
        while (i < lines.length) {
          const l = lines[i];
          const lm = l.match(RE.list);
          if (lm) {
            let text = lm[3];
            let check = null;
            const cb = text.match(/^\[( |x|X)\]\s*/);
            if (cb) { check = cb[1] !== " "; text = text.slice(cb[0].length); }
            items.push({ indent: lm[1].replace(/\t/g, "    ").length, ordered: /\d/.test(lm[2]), num: parseInt(lm[2], 10) || null, text, check, line: i + 1 });
            i++;
            continue;
          }
          // 箇条書きの続きの行（字下げされた文）は直前の項目につなげる
          if (l.trim() && /^\s{2,}/.test(l) && items.length) { items[items.length - 1].text += "\n" + l.trim(); i++; continue; }
          break;
        }
        blocks.push({ type: "list", items: nest(items), line: start, end: i });
        continue;
      }
      if (RE.quote.test(line)) {
        const buf = [];
        while (i < lines.length && RE.quote.test(lines[i])) buf.push(lines[i++].match(RE.quote)[1]);
        blocks.push({ type: "quote", text: buf.join("\n"), line: start, end: i });
        continue;
      }
      if (RE.hr.test(line)) { blocks.push({ type: "hr", line: start, end: start }); i++; continue; }
      if (!line.trim()) { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !RE.fence.test(lines[i]) && !RE.heading.test(lines[i]) && !RE.list.test(lines[i]) && !RE.quote.test(lines[i]) && !(RE.tableRow.test(lines[i]) && i + 1 < lines.length && RE.tableSep.test(lines[i + 1]))) buf.push(lines[i++]);
      blocks.push({ type: "para", text: buf.join("\n"), line: start, end: i });
    }
    return blocks;
  }

  // 字下げの深さで入れ子にする。{text, check, ordered, line, children:[]}
  function nest(flat) {
    const root = { children: [], indent: -1 };
    const stack = [root];
    for (const it of flat) {
      const node = Object.assign({}, it, { children: [] });
      while (stack.length > 1 && it.indent <= stack[stack.length - 1].indent) stack.pop();
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    }
    return root.children;
  }

  // ---------- 描画 ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 行内：**太字**、`コード`、{{変数}}、表の中の <br>
  const INLINE = /(\*\*[^*]+\*\*|`[^`]+`|\{\{[^}]+\}\}|<br\s*\/?>)/i;
  function inlineDefault(text, parent, hooks) {
    const lines = String(text).split("\n");
    lines.forEach((ln, li) => {
      if (li) parent.append(document.createElement("br"));
      for (const part of ln.split(new RegExp(INLINE.source, "gi"))) {
        if (!part) continue;
        if (/^<br\s*\/?>$/i.test(part)) parent.append(document.createElement("br"));
        else if (/^\*\*[^*]+\*\*$/.test(part)) { const b = el("strong"); inlineDefault(part.slice(2, -2), b, hooks); parent.append(b); }
        else if (/^`[^`]+`$/.test(part)) {
          // inlineCode が true を返したら、フックの側で描いたものとして <code> を作らない
          if (!(hooks && hooks.inlineCode && hooks.inlineCode(part.slice(1, -1), parent))) parent.append(el("code", null, part.slice(1, -1)));
        }
        else if (/^\{\{[^}]+\}\}$/.test(part)) parent.append(el("span", "var", part));
        else inlineText(part, parent, hooks);
      }
    });
    return parent;
  }
  function inlineText(text, parent, hooks) {
    if (hooks && hooks.text) hooks.text(text, parent);
    else parent.append(document.createTextNode(text));
  }

  function render(src, hooks) {
    const hk = hooks || {};
    const blocks = Array.isArray(src) ? src : parse(src);
    const root = el("div", "md");
    const inl = (text, parent) => inlineDefault(text, parent, hk);
    const listDom = (items) => {
      const ordered = items[0] && items[0].ordered;
      const list = el(ordered ? "ol" : "ul");
      if (ordered && items[0].num && items[0].num !== 1) list.start = items[0].num;
      for (const it of items) {
        const li = el("li");
        if (it.check != null) { li.className = "task"; li.append(el("span", "cb" + (it.check ? " on" : ""), it.check ? "☑" : "☐")); }
        inl(it.text, li);
        if (it.children.length) li.append(listDom(it.children));
        list.append(li);
      }
      return list;
    };
    for (const b of blocks) {
      let node = null;
      switch (b.type) {
        case "heading": {
          node = el("h" + Math.min(6, b.level + 1));
          inl(b.text, node);
          if (hk.heading) node = hk.heading(node, b) || node;
          break;
        }
        case "para": node = inl(b.text, el("p")); break;
        case "quote": node = inl(b.text, el("blockquote")); break;
        case "hr": node = el("hr"); break;
        case "list": node = listDom(b.items); break;
        case "code": {
          if (hk.code) node = hk.code(b);
          if (!node) { const pre = el("pre"); pre.append(el("code", null, b.text)); node = pre; }
          break;
        }
        case "table": {
          const t = el("table");
          const n = Math.max(b.head.length, ...b.rows.map((r) => r.length));
          // 数値だけの列は右寄せにする（指定があればそれを優先）
          const numeric = Array.from({ length: n }, (_, c) => b.rows.length > 0 && b.rows.every((r) => !r[c] || /^[\s\-+*]*[\d,.]+\s*(%|円|万円|件|名|時間|日|分|秒)?[\s*]*$/.test(r[c])));
          const align = (c) => b.align[c] || (numeric[c] ? "right" : "");
          // 列の最小幅（em）：その列でいちばん長いセルの見た目の長さ。ただし 10 字まで。
          // 短い列（ID・状態・数値）は折り返さず、長い文の列だけが残りの幅で折り返す。全列の最小幅が画面より広ければ表の中だけ横に流れる
          const visW = (s) => [...String(s).replace(/\*\*|`|\\\|/g, "")].reduce((w, ch) => w + (ch.codePointAt(0) < 0x80 ? 0.55 : 1), 0);
          const colMin = Array.from({ length: n }, (_, c) => Math.round(Math.min(10, Math.max(0, ...b.rows.map((r) => visW(r[c] || "")))) * 10) / 10 + 0.3);
          const thead = el("thead"), tr = el("tr");
          // 見出しも折り返してよい。ただし 6 字までと、その列の最小幅までは 1 行に保つ
          for (let c = 0; c < n; c++) {
            const th = el("th"), cell = inl(b.head[c] || "", el("div", "cell"));
            cell.style.minWidth = Math.max(colMin[c], Math.min(6, visW(b.head[c] || "")) + 0.3) + "em";
            th.append(cell);
            if (align(c)) th.style.textAlign = align(c);
            tr.append(th);
          }

      select(M.values(S.db, "owner"), f.owner, set("owner"), "担当", "担当：すべて"),
      overdue, sort,
      el("button", { type: "button", onclick: () => download(`質問箱_${M.today()}.csv`, M.itemsCsv(M.filter(S.db, S.f)), "text/csv;charset=utf-8") }, "表示中を CSV"),
      el("button", { type: "button", title: "表示中の質問・回答・状態を AI に渡す JSON で保存（控えの書き出しとは別。読み込みには使えません）", onclick: () => download(`質問箱_AI用_${M.today()}.json`, M.toAiJson(M.filter(S.db, S.f)), "application/json") }, "表示中を AI 用 JSON"),
      aiCopy);
    const base = M.filter(S.db, Object.assign({}, f, { status: "" }));
    const head = el("div", { class: "card" }, countBar(M.counts(base, (x) => x.status), f.status, set("status")), toolbar);
    const body = el("div", { id: "list-body" });
    S._listBody = body;
    if (!all.length) {
      body.append(el("section", { class: "card empty" }, el("p", null, "まだ質問がありません。"), el("button", { class: "primary", type: "button", onclick: () => { S.tab = "import"; render(); } }, "取り込みへ")));
      return el("div", null, body);
    }
    fillList(body, list);
    return el("div", null, head, body);
  }
  function renderListBody() {
    if (!S._listBody) return;
    fillList(S._listBody, M.filter(S.db, S.f));
  }
  function fillList(body, list) {
    const day = M.today();
    const rowsEls = [];
    for (const it of list) {
      const open = S.open === it.id;
      const checkN = it.tables.reduce((a, t) => a + t.rows.filter((r) => t.stateCol >= 0 && r.state !== "確定").length, 0);
      const inp = (field, type, label) => {
        const n = el("input", { type, value: it[field] || "", "aria-label": `${it.id} の${label}` });
        n.addEventListener("change", () => { if (M.edit(S.db, it.id, field, n.value)) save(); if (field === "due") render(); });
        return n;
      };
      const tr = el("tr", { class: open ? "open" : "" },
        el("td", { class: "id" }, el("button", { class: "link", type: "button", "aria-expanded": open ? "true" : "false", onclick: () => { S.open = open ? null : it.id; S.editAnswer = false; S.confirmDelete = null; render(); } }, (open ? "▾ " : "▸ ") + it.id)),
        el("td", null, stateSelect(it.status, (v) => { M.edit(S.db, it.id, "status", v); save(); render(); }, `${it.id} の状態`), it.edited.status ? el("span", { class: "edited", title: "手で直した状態。貼り直しても残ります" }, "手") : null),
        el("td", { class: "q" }, el("button", { class: "link q-link", type: "button", onclick: () => { S.open = open ? null : it.id; S.editAnswer = false; render(); } }, short(it.question, 70)),
          el("div", { class: "muted" }, [it.project, it.category].filter(Boolean).join(" ／ "))),
        el("td", { class: "num" }, checkN ? el("span", { class: "st st-check", title: "表の中で確定していない項目" }, `未確定 ${checkN}`) : ""),
        el("td", null, inp("owner", "text", "担当")),
        el("td", { class: M.isOverdue(it, day) ? "overdue" : "" }, inp("due", "date", "期限"), M.isOverdue(it, day) ? el("span", { class: "overdue-label" }, "期限切れ") : null),
        el("td", null, inp("memo", "text", "メモ")),
        el("td", { class: "muted nowrap" }, fmtAt(it.updatedAt)));
      rowsEls.push(tr);
      if (open) rowsEls.push(el("tr", { class: "detail-row" }, el("td", { colspan: "8" }, detailView(it))));
    }
    const table = el("table", { class: "grid" },
      el("thead", null, el("tr", null, ["ID", "状態", "質問", "表", "担当", "期限", "メモ", "更新"].map((h) => el("th", null, h)))),
      el("tbody", null, rowsEls));
    body.replaceChildren(el("section", { class: "card" },
      el("div", { class: "muted" }, `${list.length} 件 ／ 全 ${S.db.items.length} 件`),
      list.length ? el("div", { class: "tablewrap" }, table) : el("p", null, "条件に合う質問はありません")));
  }

  function detailView(it) {
    const field = (k, label, type) => {
      const n = el(type === "area" ? "textarea" : "input", type === "area" ? { rows: "3", "aria-label": label } : { type: "text", value: it[k] || "", "aria-label": label });
      if (type === "area") n.value = it[k] || "";
      n.addEventListener("change", () => { if (M.edit(S.db, it.id, k, n.value)) { save(); render(); } });
      return el("label", { class: "field" }, el("span", null, label, it.edited[k] ? el("span", { class: "edited", title: "手で直した値。貼り直しても残ります" }, "手") : null), n);
    };
    const meta = el("div", { class: "meta-grid" },
      field("project", "案件"), field("category", "分類"), field("source", "根拠"), field("date", "日付"), field("reason", "要確認の理由"));
    let answer;
    if (S.editAnswer) {
      const ta = el("textarea", { rows: "14", "aria-label": "回答（Markdown）" });
      ta.value = it.answer;
      answer = el("div", null, ta, el("div", { class: "row-actions" },
        el("button", { class: "primary", type: "button", onclick: () => {
          const w = M.editAnswer(S.db, it.id, ta.value);
          S.editAnswer = false;
          S.answerWarn = w && w.length ? w : null;
          save();
          render();
        } }, "回答を保存"),
        el("button", { type: "button", onclick: () => { S.editAnswer = false; render(); } }, "やめる")));
    } else {
      answer = el("div", null, renderAnswer(it), S.answerWarn ? el("ul", { class: "warns" }, S.answerWarn.map((w) => el("li", null, w))) : null);
      S.answerWarn = null;
    }
    const reask = el("button", { type: "button" }, "聞き直す文をコピー");
    reask.addEventListener("click", async () => flash(reask, (await copyText(M.reaskText(it))) ? "コピーしました。NotebookLM に貼ってください" : "コピーできませんでした", 2400));
    const del = el("button", { class: "danger", type: "button", onclick: () => {
      if (S.confirmDelete === it.id) { M.remove(S.db, it.id); S.open = null; S.confirmDelete = null; save(`${it.id} を削除しました`); render(); }
      else { S.confirmDelete = it.id; render(); }
    } }, S.confirmDelete === it.id ? "もう一度押すと削除します" : "この質問を削除");
    const hist = el("details", { class: "hist" }, el("summary", null, `履歴 ${it.history.length}`),
      el("ul", null, it.history.slice().reverse().map((h) => el("li", null, el("span", { class: "muted nowrap" }, fmtAt(h.at)), ` ${h.field}：`, h.from ? `${short(h.from, 40)} → ` : "", short(h.to, 40)))));
    return el("div", { class: "detail" },
      meta,
      field("question", "質問", "area"),
      el("div", { class: "answer-head" }, el("h3", null, "回答"), S.editAnswer ? null : el("button", { class: "small", type: "button", onclick: () => { S.editAnswer = true; render(); } }, "回答を編集")),
      answer,
      el("div", { class: "row-actions" }, reask, del),
      hist);
  }

  // ---------- 項目の一覧 ----------
  function viewRows() {
    const all = M.rows(S.db);
    const set = (k) => (v) => { S.rf[k] = v; render(); };
    if (!all.length) return el("section", { class: "card empty" }, el("p", null, "表の項目はまだありません。回答の表に「状態」列があると、ここに行ごとに並びます。"));
    const search = el("input", { type: "search", value: S.rf.text, placeholder: "検索（項目名・内容）", "aria-label": "検索" });
    const body = el("div");
    const fill = () => {
      const list = M.filterRows(all, S.rf);
      const table = el("table", { class: "grid" },
        el("thead", null, el("tr", null, ["ID", "案件", "表", "項目", "状態", "内容"].map((h) => el("th", null, h)))),
        el("tbody", null, list.map((r) => el("tr", null,
          el("td", { class: "id" }, el("button", { class: "link", type: "button", onclick: () => { S.tab = "list"; S.open = r.id; S.f = Object.assign({}, S.f, { text: "", status: "", project: "", category: "", owner: "", overdue: false }); render(); } }, r.id)),
          el("td", null, r.project),
          el("td", { class: "nowrap" }, "表" + (r.table + 1)),
          el("td", null, el("strong", null, r.key)),
          el("td", null, stateSelect(r.state, (v) => { M.editRow(S.db, r.id, r.table, r.key, v); save(); render(); }, `${r.key} の状態`), r.edited ? el("span", { class: "edited", title: "手で直した状態" }, "手") : null),
          el("td", { class: "muted" }, r.head.map((h, c) => (c === 0 || c === r.stateCol || !r.cells[c] ? null : `${h}: ${r.cells[c]}`)).filter(Boolean).join(" ／ "))))));
      body.replaceChildren(el("section", { class: "card" }, el("div", { class: "muted" }, `${list.length} 行 ／ 全 ${all.length} 行`), list.length ? el("div", { class: "tablewrap" }, table) : el("p", null, "条件に合う項目はありません")));
    };
    search.addEventListener("input", () => { S.rf.text = search.value; fill(); });
    fill();
    const base = M.filterRows(all, Object.assign({}, S.rf, { status: "" }));
    return el("div", null,
      el("div", { class: "card" }, countBar(M.counts(base, (r) => r.state), S.rf.status, set("status")),
        el("div", { class: "toolbar" }, search, select([...new Set(all.map((r) => r.project).filter(Boolean))].sort(), S.rf.project, set("project"), "案件", "案件：すべて"),
          el("button", { type: "button", onclick: () => download(`質問箱_項目_${M.today()}.csv`, M.rowsCsv(M.filterRows(all, S.rf)), "text/csv;charset=utf-8") }, "表示中を CSV"))),
      body);
  }

  // ---------- 使い方 ----------
  function viewHelp() {
    const copy = el("button", { class: "primary", type: "button" }, "指示をコピー");
    copy.addEventListener("click", async () => flash(copy, (await copyText(GK.PROMPT)) ? "コピーしました" : "コピーできませんでした"));
    return el("div", null,
      el("section", { class: "card" }, el("h2", null, "使い方"),
        el("ol", { class: "steps" },
          el("li", null, el("strong", null, "指示を入れる："), "下の指示をコピーし、NotebookLM の「チャットを設定」（カスタム指示）に貼ります。1 回だけでよい"),
          el("li", null, el("strong", null, "質問する："), "1 問でもまとめてでも。回答は ```markdown の囲みで返ってきます"),
          el("li", null, el("strong", null, "取り込む："), "回答をまるごとコピーし、「取り込み」タブに貼って「読み取る」→「取り込む」"),
          el("li", null, el("strong", null, "管理する："), "「質問の一覧」で状態・担当・期限・メモを直す。表の行ごとの状態は質問を開くか「項目の一覧」で直す"),
          el("li", null, el("strong", null, "聞き直す："), "質問を開いて「聞き直す文をコピー」→ NotebookLM に貼る。同じ ID で返るので、取り込むと更新になります（手で直した値は残ります）"),
          el("li", null, el("strong", null, "控え："), "右上の「書き出し」で JSON を保存。別の PC やブラウザでは「読み込み」"),
          el("li", null, el("strong", null, "AI に渡す："), "「質問の一覧」で絞り込んでから「表示中を AI 用 JSON」で保存するかコピー。質問・回答・状態（表の行ごとの状態も）だけが入ります。控えではないので読み込みには使えません")),
        el("p", { class: "muted" }, "保存先はこのブラウザの中だけです。ネットワークには出ません。ブラウザのデータを消すと消えるので、ときどき書き出してください。")),
      el("section", { class: "card" }, el("div", { class: "answer-head" }, el("h2", null, "NotebookLM に貼る指示"), copy), el("pre", { class: "prompt" }, GK.PROMPT)));
  }

  // ---------- 書き出し・読み込み ----------
  function setupIO() {
    $("btn-export").addEventListener("click", () => download(`質問箱_${M.today()}.json`, M.toJson(S.db), "application/json"));
    const file = $("file-json");
    $("btn-import").addEventListener("click", () => file.click());
    file.addEventListener("change", async () => {
      const f = file.files && file.files[0];
      file.value = "";
      if (!f) return;
      try {
        S.pendingJson = M.fromJson(await f.text());
        showConfirm();
      } catch (e) {
        showConfirm(e.message);
      }
    });
  }
  function showConfirm(error) {
    const box = $("confirm");
    if (error) {
      box.replaceChildren(el("span", { class: "warn-text" }, "読み込めません：" + error), el("button", { type: "button", onclick: () => box.replaceChildren() }, "閉じる"));
      return;
    }
    box.replaceChildren(
      el("span", null, `${S.pendingJson.items.length} 件で置き換えます。今の ${S.db.items.length} 件は消えます。`),
      el("button", { class: "danger", type: "button", onclick: () => { S.db = S.pendingJson; S.pendingJson = null; S.open = null; box.replaceChildren(); save("読み込みました"); render(); } }, "置き換える"),
      el("button", { type: "button", onclick: () => { S.pendingJson = null; box.replaceChildren(); } }, "やめる"));
  }

  async function start() {
    setupIO();
    try {
      const saved = await GK.store.load();
      if (saved) S.db = M.fromJson(JSON.stringify(Object.assign({ app: "qa-box" }, saved)));
    } catch (e) {
      setSaveState("保存データを読めませんでした：" + e.message, true);
    }
    if (!S.db.items.length) S.tab = "help";
    setSaveState(saveLabel());
    render();
  }

  GK.app = { start, state: S };
  if (typeof document !== "undefined") document.addEventListener("DOMContentLoaded", start);
})(globalThis.GK = globalThis.GK || {});

</script>
</body>
